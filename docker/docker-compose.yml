# =============================================================================
# Project Manager — Docker Compose (base)
# =============================================================================
# Frappe/ERPNext + project_manager + pm_construction, MariaDB, Redis, Meilisearch, MinIO.
# Run through scripts/bootstrap.ps1 or scripts/bootstrap.sh: they create docker/.env
# (secrets included) and pick the overlays through COMPOSE_FILE:
#   docker-compose.local.yml  publishes the site on 127.0.0.1:${HTTP_PUBLISH_PORT}
#   docker-compose.dev.yml    also mounts the source and reloads it (developers)
# =============================================================================

x-app-image: &app-image
  image: pm-custom:${ERPNEXT_VERSION:?}
  networks:
    - frappe_network
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-redis-env: &redis-env
  FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE:-redis-cache:6379}
  FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE:-redis-queue:6379}

services:
  # ---------------------------------------------------------------------------
  # Frappe backend (gunicorn) — holds the build section of the shared image
  # ---------------------------------------------------------------------------
  backend:
    <<: *app-image
    networks:
      frappe_network:
        # Socket.IO checks each user by calling the backend at http://<site>:8000 (docker/Dockerfile, nginx)
        aliases:
          - ${FRAPPE_SITE_NAME:?}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:?}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "${DB_PORT:-3306}"
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  # ---------------------------------------------------------------------------
  # One-shot: writes common_site_config.json
  # ---------------------------------------------------------------------------
  configurator:
    <<: *app-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port 9000;
        bench set-config -gp workers '{"pm": {"timeout": 600}}';
        bench set-config -g meilisearch_host "http://meilisearch:7700";
        bench set-config -g meilisearch_master_key "$$MEILISEARCH_MASTER_KEY";
        bench set-config -g pm_minio_endpoint "http://minio:9000";
        bench set-config -g pm_minio_bucket "$$MINIO_BUCKET";
        bench set-config -g pm_minio_access_key "$$MINIO_APP_ACCESS_KEY";
        bench set-config -g pm_minio_secret_key "$$MINIO_APP_SECRET_KEY";
        if [ -n "$$PUBLIC_URL" ]; then bench set-config -g host_name "$$PUBLIC_URL"; fi;
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: "${DB_PORT:-3306}"
      REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
      REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-pm-files}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-pm-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Run scripts/bootstrap to generate the secrets}
      PUBLIC_URL: ${PUBLIC_URL:-}

  # ---------------------------------------------------------------------------
  # One-shot: creates the site with ERPNext and the apps (skipped when it exists)
  # ---------------------------------------------------------------------------
  create-site:
    <<: *app-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 120 )); then echo "common_site_config.json is incomplete"; exit 1; fi
        done;
        if [ -f "sites/$$FRAPPE_SITE_NAME/site_config.json" ]; then
          bench --site "$$FRAPPE_SITE_NAME" list-apps >/dev/null;
          echo "Site $$FRAPPE_SITE_NAME already exists; skipping creation";
        else
          apps=();
          for app in $$PM_INSTALL_APPS; do apps+=(--install-app "$$app"); done;
          bench new-site "$$FRAPPE_SITE_NAME" --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$MARIADB_ROOT_PASSWORD" "$${apps[@]}" --set-default;
        fi;
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/bootstrap to generate the secrets}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      # CI installs the core alone to prove it never needs pm_construction.
      PM_INSTALL_APPS: ${PM_INSTALL_APPS:-erpnext project_manager pm_construction}
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # One-shot: ERPNext setup wizard from .env (company, fiscal year, holidays), then migrate.
  # Both steps are idempotent, so bootstrap runs this on every start.
  # ---------------------------------------------------------------------------
  setup-site:
    <<: *app-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        bench --site "$$FRAPPE_SITE_NAME" execute project_manager.project_manager.setup.wizard.ensure_setup;
        bench --site "$$FRAPPE_SITE_NAME" migrate;
    environment:
      <<: *redis-env
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:?}
      COMPANY_NAME: ${COMPANY_NAME:?}
      COMPANY_ABBR: ${COMPANY_ABBR:?}
      COUNTRY: ${COUNTRY:-Vietnam}
      CURRENCY: ${CURRENCY:-VND}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      LANGUAGE: ${LANGUAGE:-vi}
      FY_START: ${FY_START:-01-01}
      WEEKLY_OFF: ${WEEKLY_OFF:-Sunday}
    depends_on:
      create-site:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # MariaDB
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:11.8.6
    networks:
      - frappe_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb/my_custom.cnf:/etc/mysql/conf.d/my_custom.cnf:ro

  # ---------------------------------------------------------------------------
  # nginx (reverse proxy + static files). The local/dev overlays publish it.
  # ---------------------------------------------------------------------------
  frontend:
    <<: *app-image
    restart: unless-stopped
    depends_on:
      - backend
      - websocket
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME:?}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-200m}

  # ---------------------------------------------------------------------------
  # Socket.IO (realtime)
  # ---------------------------------------------------------------------------
  websocket:
    <<: *app-image
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment: *redis-env

  redis-cache:
    image: redis:7.4.9-alpine
    networks:
      - frappe_network
    restart: unless-stopped

  redis-queue:
    image: redis:7.4.9-alpine
    networks:
      - frappe_network
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # ---------------------------------------------------------------------------
  # Workers. "pm" runs the project jobs (progress rollup, scheduling, notification
  # fan-out) so they never wait behind ERPNext's own jobs.
  # ---------------------------------------------------------------------------
  queue-pm:
    <<: *app-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "pm,short"]
    environment: *redis-env

  queue-short:
    <<: *app-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    environment: *redis-env

  queue-long:
    <<: *app-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment: *redis-env

  scheduler:
    <<: *app-image
    restart: unless-stopped
    command: ["bench", "schedule"]

  # ---------------------------------------------------------------------------
  # Meilisearch — full-text search. Internal only (frappe_network).
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    networks:
      - frappe_network
    expose:
      - "7700"
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?}
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512MiB
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO: photos and documents (private; only the backend talks to it)
  # ---------------------------------------------------------------------------
  minio:
    image: pm-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: minio
      dockerfile: Dockerfile.server
    networks:
      - frappe_network
    expose:
      - "9000"
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pmadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/bootstrap to generate the secrets}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # One-shot: the bucket, and an application user that may only read and write it (idempotent)
  minio-init:
    image: pm-minio-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: minio
      dockerfile: Dockerfile.mc
    networks:
      - frappe_network
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        tries=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then echo "MinIO did not answer" >&2; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/policy.json
        if ! mc admin user info local "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1; then
          mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        fi
        mc admin policy create local pm-app /tmp/policy.json >/dev/null || mc admin policy info local pm-app >/dev/null
        mc admin policy attach local pm-app --user "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1 || true
        mc alias set app http://minio:9000 "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null
        probe="app/$$MINIO_BUCKET/.pm-check-$$(cat /proc/sys/kernel/random/uuid)"
        printf ok | mc pipe "$$probe" >/dev/null
        mc cat "$$probe" >/dev/null
        mc rm "$$probe" >/dev/null
        echo "MinIO ready: bucket $$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pmadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-pm-files}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-pm-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}
      MC_CONFIG_DIR: /tmp/mc
    tmpfs:
      - /tmp
    depends_on:
      minio:
        condition: service_healthy

# =============================================================================
# Volumes — one per component, so each can be backed up on its own
# =============================================================================
volumes:
  db-data:
    name: ${DATA_VOLUME_PREFIX:-pm}_db_data
  redis-queue-data:
    name: ${DATA_VOLUME_PREFIX:-pm}_redis_queue
  sites:
    name: ${DATA_VOLUME_PREFIX:-pm}_sites
  logs:
    name: ${DATA_VOLUME_PREFIX:-pm}_logs
  meilisearch-data:
    name: ${DATA_VOLUME_PREFIX:-pm}_meilisearch
  minio-data:
    name: ${DATA_VOLUME_PREFIX:-pm}_minio

networks:
  frappe_network:
    name: ${DATA_VOLUME_PREFIX:-pm}_network
    driver: bridge
